[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-agent"
version = "0.1.0"
description = "Experimental paired-utility evaluation and experience selection for agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ahian-lee/cue-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
